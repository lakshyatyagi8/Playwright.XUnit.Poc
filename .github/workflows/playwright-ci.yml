name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'QA'
        type: choice
        options:
          - QA
          - Staging
          - Production
      
      base_url:
        description: 'Base URL for application settings'
        required: false
        default: 'https://www.google.com'
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Playwright Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore

      # We install the CLI globally so we can easily install browser binaries
      - name: Install Playwright CLI globally
        run: dotnet tool install --global Microsoft.Playwright.CLI
        
      - name: Install Playwright Dependencies
        run: pwsh PlaywrightAutomationPoc/bin/Debug/net10.0/playwright.ps1 install --with-deps

      - name: Run Playwright Tests
        run: dotnet test --no-build --verbosity normal
        env:
          # Standard .NET environment selector (loads appsettings.QA.json etc)
          ASPNETCORE_ENVIRONMENT: ${{ github.event.inputs.environment || 'QA' }}

          # Enforce headless mode in CI to avoid X server / display requirements
          PlaywrightSettings__Headless: true

          # Override BaseUrl dynamically if provided in the manual trigger, otherwise default to Google Maps
          ApplicationSettings__BaseUrl: ${{ github.event.inputs.base_url || 'https://www.google.com' }}

      - name: Upload Extent HTML Report
        uses: actions/upload-artifact@v4
        if: always() # Ensure reports are uploaded even if tests fail
        with:
          name: Extent-Test-Report
          # Use glob pattern to find the Reports folder regardless of output directory
          path: '**/Reports/'
          retention-days: 30

      - name: Upload Playwright Traces & Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Playwright-Traces
          path: |
            **/Traces/
            **/TestResults/Videos/
          retention-days: 30
